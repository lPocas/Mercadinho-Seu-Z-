<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mercadinho Seu Zé</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="login-screen">
        <div class="login-box">
            <img src="logo.jpg" alt="Logo" class="login-logo">
            <h1>Mercadinho Seu Zé</h1>
            <div class="input-group">
                <label>Usuário:</label>
                <input type="text" id="user" placeholder="Digite seu usuário">
            </div>
            <div class="input-group">
                <label>Senha:</label>
                <input type="password" id="pass" placeholder="Digite sua senha">
            </div>
            <button class="login-btn" onclick="logar()">Acessar Painel</button>
        </div>
    </div>
    <script src="sistema.js"></script>
</body>
</html>
