<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Sistema Mercadinho</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="system">
        <div class="sidebar" id="sidebar-container"></div>

        <div class="main-container">
            <div class="header">
                <h1>Dashboard</h1>
                <div class="user-pill">
                    <i class="fa-solid fa-circle-user"></i> <span id="userName">...</span>
                    <button onclick="deslogar()" style="border:none; background:none; color:var(--danger); cursor:pointer; font-weight:bold; margin-left:10px">Sair</button>
                </div>
            </div>

            <div class="box">
                <h3><i class="fa-solid fa-hand-wave" style="color: #f59e0b;"></i> Bem-vindo, <span id="welcomeName">...</span>!</h3>
                <p id="welcomeMessage">Carregando informações do painel...</p>
                
                <div id="adm-cards" style="display:none; grid-template-columns: 1fr 1fr; gap: 15px; margin-top:20px;">
                    <div style="background:#f8fafc; padding:15px; border-radius:10px; border-left:4px solid var(--danger)">
                        <span style="font-size:12px; color:var(--secondary-text)">Total em Fiado</span>
                        <h4 id="dash-fiado" style="font-size:20px; color:var(--danger)">R$ 0,00</h4>
                    </div>
                    <div style="background:#f8fafc; padding:15px; border-radius:10px; border-left:4px solid var(--success)">
                        <span style="font-size:12px; color:var(--secondary-text)">Lucro Acumulado</span>
                        <h4 id="dash-lucro" style="font-size:20px; color:var(--success)">R$ 0,00</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="sistema.js"></script>
    <script>
        document.getElementById('sidebar-container').innerHTML = menuLateralTemplate;
        document.getElementById('m-dash').classList.add('active');

        function atualizarTabelasPagina() {
            if(cargoLogado === "Administrador") {
                document.getElementById('welcomeMessage').innerText = "Painel Administrativo liberado. Navegue utilizando o menu lateral.";
                document.getElementById('adm-cards').style.display = 'grid';
                
                let totalFiado = db_dividas.reduce((acc, d) => acc + parseFloat(d.valor), 0);
                let lucroTotal = db_vendas.reduce((acc, v) => acc + v.lucroLiquido, 0);

                document.getElementById('dash-fiado').innerText = `R$ ${totalFiado.toFixed(2)}`;
                document.getElementById('dash-lucro').innerText = `R$ ${lucroTotal.toFixed(2)}`;
            } else {
                document.getElementById('welcomeMessage').innerText = "Painel do Funcionário ativo. Use as seções permitidas ao lado.";
            }
        }
    </script>
</body>
</html>
