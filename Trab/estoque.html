<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estoque - Sistema Mercadinho</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="system">
        <div class="sidebar" id="sidebar-container"></div>

        <div class="main-container">
            <div class="header">
                <h1>Gerenciamento de Estoque</h1>
                <div class="user-pill">
                    <i class="fa-solid fa-circle-user"></i> <span id="userName">...</span>
                    <button onclick="deslogar()" style="border:none; background:none; color:var(--danger); cursor:pointer; font-weight:bold; margin-left:10px">Sair</button>
                </div>
            </div>

            <div class="box">
                <h3><i class="fa-solid fa-plus-circle"></i> Novo Item</h3>
                <div class="form-grid">
                    <div class="form-group"><label>Nome do Produto</label><input type="text" id="p-nome"></div>
                    <div class="form-group"><label>Qtd em Estoque</label><input type="number" id="p-qtd"></div>
                    <div class="form-group"><label>Custo (R$)</label><input type="number" id="p-custo"></div>
                    <div class="form-group"><label>Venda (R$)</label><input type="number" id="p-venda"></div>
                    <div class="form-group"><label>Vencimento</label><input type="date" id="p-val"></div>
                    <div class="form-group"><label>Fornecedor</label><input type="text" id="p-forn"></div>
                    <div class="form-group"><label>Contato Fornecedor</label><input type="text" id="p-forn-contato"></div>
                </div>
                <button class="btn btn-blue" onclick="salvarProduto()">Cadastrar no Estoque</button>
            </div>

            <div class="box">
                <h3><i class="fa-solid fa-list-check"></i> Itens Cadastrados</h3>
                <table id="tbl-estoque">
                    <thead>
                        <tr>
                            <th>Produto</th><th>Qtd</th><th>Preço Venda</th><th>Fornecedor</th><th>Contato</th><th>Validade</th><th>Status</th><th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="sistema.js"></script>
    <script>
        document.getElementById('sidebar-container').innerHTML = menuLateralTemplate;
        const estoqueElement = document.getElementById('m-estoque');
        if (estoqueElement) estoqueElement.classList.add('active');

        function salvarProduto() {
            const n = document.getElementById('p-nome').value;
            const q = parseInt(document.getElementById('p-qtd').value) || 0;
            const c = parseFloat(document.getElementById('p-custo').value) || 0;
            const v = parseFloat(document.getElementById('p-venda').value) || 0;
            const d = document.getElementById('p-val').value;
            const f = document.getElementById('p-forn').value || '--';
            const fc = document.getElementById('p-forn-contato').value || '--';

            if(!n || q <= 0) return alert('Campos obrigatórios vazios!');

            db_estoque.push({ id: Date.now(), nome: n, qtd: q, custo: c, venda: v, val: d, forn: f, fornContato: fc });
            localStorage.setItem('m_estoque', JSON.stringify(db_estoque));
            addLog(`Cadastrou: ${n} (${q} un)`);
            
            // Limpar Campos
            document.querySelectorAll('.form-grid input').forEach(i => i.value = '');
            atualizarTabelasPagina();
            alert('Cadastrado com sucesso!');
        }

        function registrarVenda(id) {
            const p = db_estoque.find(x => x.id === id);
            if (!p || p.qtd <= 0) return alert("Produto esgotado!");

            p.qtd -= 1;
            const lucroUnidade = p.venda - p.custo;

            db_vendas.unshift({
                data: new Date().toLocaleString(),
                nome: p.nome,
                valorVenda: p.venda,
                lucroLiquido: lucroUnidade
            });

            localStorage.setItem('m_estoque', JSON.stringify(db_estoque));
            localStorage.setItem('m_vendas', JSON.stringify(db_vendas));
            
            addLog(`Vendeu: 1un de ${p.nome}`);
            atualizarTabelasPagina();
            alert(`Venda realizada! Lucro: R$ ${lucroUnidade.toFixed(2)}`);
        }

        function apagarProduto(id) {
            if(!confirm("Remover item?")) return;
            db_estoque = db_estoque.filter(x => x.id !== id);
            localStorage.setItem('m_estoque', JSON.stringify(db_estoque));
            addLog('Removeu um item do estoque');
            atualizarTabelasPagina();
        }

        function atualizarTabelasPagina() {
            const hoje = new Date();
            const ehFuncionario = (cargoLogado !== "Administrador");

            document.querySelector('#tbl-estoque tbody').innerHTML = db_estoque.map(p => {
                const val = p.val ? new Date(p.val + 'T23:59:59') : null;
                const vencido = val && val < hoje;
                
                return `
                    <tr>
                        <td><b>${p.nome}</b></td>
                        <td>${p.qtd} un</td>
                        <td>R$ ${parseFloat(p.venda).toFixed(2)}</td>
                        <td>${ehFuncionario ? "<i>[Restrito]</i>" : p.forn}</td>
                        <td>${ehFuncionario ? "<i>[Restrito]</i>" : p.fornContato}</td>
                        <td>${p.val || '--'}</td>
                        <td><span class="badge ${vencido ? 'badge-red' : 'badge-green'}">${vencido ? 'Vencido' : 'Ok'}</span></td>
                        <td>
                            <button class="btn" style="background:var(--success); color:white; padding:4px 8px; font-size:12px;" onclick="registrarVenda(${p.id})">Vender +1</button>
                            <i class="fa-solid fa-trash" style="color:red; cursor:pointer; margin-left:10px" onclick="apagarProduto(${p.id})"></i>
                        </td>
                    </tr>
                `;
            }).join('');
        }
    </script>
</body>
</html>
